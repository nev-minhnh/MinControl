name = "mincontrol-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[[durable_objects.bindings]]
name = "DEVICE_HUB"
class_name = "DeviceHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeviceHub"]

[[d1_databases]]
binding = "DB"
database_name = "mincontrol"
database_id = "<D1_DATABASE_ID>"
migrations_dir = "migrations"

# R2 is not used (API.md section 9: screenshots stay on the device and are relayed on demand).
# Uncomment only if you want the legacy bucket bound; the code does not need it.
# [[r2_buckets]]
# binding = "BLOBS"
# bucket_name = "mincontrol-blobs"

[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true

# Secrets (set with `wrangler secret put <NAME>`, never in this file):
#   ADMIN_BOOTSTRAP_SECRET, UPLOAD_TOKEN_SECRET, FCM_SERVICE_ACCOUNT_JSON
